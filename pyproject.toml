[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "aerorl"
version = "0.1.0"
description = "Autonomous quadrotor racing experiments using existing simulation tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@f83fbdd4ee1c07e1afa52694963f3a9a889a0f56",
    "gymnasium>=1.3,<2",
    "numpy>=2.5,<3",
    "pybullet==3.2.7",
    "stable-baselines3>=2.9,<3",
    "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18"]

[tool.setuptools.packages.find]
include = ["aerorl*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
